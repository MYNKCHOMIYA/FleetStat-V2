<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FleetStat V2 — Login</title>
  <meta name="description" content="Sign in to FleetStat V2, your fleet management dashboard." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-base: #0a0c12;
      --bg-card: #111420;
      --border: rgba(255,255,255,0.07);
      --border-focus: rgba(99,179,237,0.55);
      --accent: #3b82f6;
      --accent-glow: rgba(59,130,246,0.35);
      --accent-2: #818cf8;
      --text-primary: #f1f5f9;
      --text-muted: #64748b;
      --text-label: #94a3b8;
      --error-bg: rgba(239,68,68,0.12);
    }
    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      overflow: hidden;
    }
    .bg-scene { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
    .bg-scene::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(59,130,246,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(129,140,248,0.10) 0%, transparent 55%);
    }
    .grid-lines {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: radial-gradient(ellipse 100% 100% at 50% 50%, black 30%, transparent 80%);
    }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4; animation: drift 18s ease-in-out infinite; }
    .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(59,130,246,0.5), transparent 65%); top: -200px; left: -100px; }
    .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(129,140,248,0.45), transparent 65%); bottom: -150px; right: -80px; animation-delay: -8s; }
    .orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(16,185,129,0.25), transparent 65%); top: 50%; left: 60%; animation-delay: -4s; }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -40px) scale(1.05); }
      66% { transform: translate(-20px, 30px) scale(0.97); }
    }
    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 32px 64px rgba(0,0,0,0.55), 0 0 80px rgba(59,130,246,0.07);
      animation: cardIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; }
    .brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 20px var(--accent-glow);
      flex-shrink: 0;
    }
    .brand-icon svg { width: 22px; height: 22px; fill: white; }
    .brand-text { display: flex; flex-direction: column; line-height: 1; }
    .brand-name {
      font-size: 17px; font-weight: 700; letter-spacing: -0.3px;
      background: linear-gradient(90deg, #f1f5f9, var(--accent-2));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-sub { font-size: 10px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-top: 3px; }
    .card-title { font-size: 24px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 6px; }
    .card-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 32px; }
    .tabs {
      display: flex; gap: 4px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 10px; padding: 4px; margin-bottom: 28px;
    }
    .tab-btn {
      flex: 1; padding: 9px 0; font-size: 13px; font-weight: 500;
      border: none; background: transparent; color: var(--text-muted);
      border-radius: 7px; cursor: pointer; transition: all 0.2s ease; font-family: inherit;
    }
    .tab-btn.active { background: var(--accent); color: #fff; box-shadow: 0 2px 12px var(--accent-glow); }
    .tab-btn:not(.active):hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
    .form-panel { display: none; }
    .form-panel.active { display: block; animation: fadeSlide 0.3s ease both; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-label); margin-bottom: 7px; }
    .input-wrap { position: relative; }
    .input-wrap .input-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; transition: color 0.2s; }
    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px 12px 42px;
      font-size: 14px; color: var(--text-primary); font-family: inherit; outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .input-wrap input::placeholder { color: var(--text-muted); }
    .input-wrap input:focus { border-color: var(--border-focus); background: rgba(59,130,246,0.05); box-shadow: 0 0 0 3px rgba(59,130,246,0.12); }
    .input-wrap:focus-within .input-icon { color: var(--accent); }
    .pw-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 0; display: flex; align-items: center; transition: color 0.2s; }
    .pw-toggle:hover { color: var(--text-primary); }
    .input-wrap.has-toggle input { padding-right: 44px; }
    .alert {
      display: none; align-items: flex-start; gap: 10px;
      padding: 12px 14px; border-radius: 10px; font-size: 13px; font-weight: 500;
      margin-bottom: 16px; border: 1px solid transparent;
    }
    .alert.error { background: var(--error-bg); border-color: rgba(239,68,68,0.25); color: #fca5a5; }
    .alert.success { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.25); color: #86efac; }
    .alert.show { display: flex; animation: alertIn 0.25s ease both; }
    @keyframes alertIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .btn-submit {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      border: none; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600;
      color: #fff; cursor: pointer; position: relative; overflow: hidden; margin-top: 8px;
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(59,130,246,0.5); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-inner { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .spinner { display: none; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card-footer { margin-top: 22px; text-align: center; font-size: 12px; color: var(--text-muted); }
    .dashboard-hint { display: none; text-align: center; padding: 20px 0; }
    .check-icon {
      width: 56px; height: 56px;
      background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3);
      border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
    }
    .dashboard-hint h3 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
    .dashboard-hint p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
    .btn-secondary {
      padding: 10px 24px;
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text-primary); font-family: inherit;
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.10); }
  </style>
</head>
<body>
<div class="bg-scene">
  <div class="grid-lines"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="page">
  <div class="card" id="card">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zm-1.5 1.5 1.96 2.5H17V9.5h1.5zM6 18c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm11 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">FleetStat</span>
        <span class="brand-sub">Management Platform</span>
      </div>
    </div>

    <h1 class="card-title">Welcome back</h1>
    <p class="card-subtitle">Sign in to your account to continue</p>

    <div class="tabs" role="tablist" id="tabs">
      <button class="tab-btn active" role="tab" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" role="tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>

    <div class="alert" id="alert" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;margin-top:1px">
        <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
      </svg>
      <span id="alert-text"></span>
    </div>

    <!-- Login Panel -->
    <div class="form-panel active" id="panel-login">
      <form id="form-login" novalidate>
        <div class="field">
          <label for="login-email">Email address</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="input-wrap has-toggle">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="pw-toggle" onclick="togglePw('login-password',this)" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="btn-login">
          <div class="btn-inner">
            <div class="spinner" id="spinner-login"></div>
            <span id="btn-login-text">Sign In</span>
          </div>
        </button>
      </form>
    </div>

    <!-- Register Panel -->
    <div class="form-panel" id="panel-register">
      <form id="form-register" novalidate>
        <div class="field">
          <label for="reg-username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="reg-username" placeholder="johndoe" autocomplete="username" required />
          </div>
        </div>
        <div class="field">
          <label for="reg-email">Email address</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
              </svg>
            </span>
            <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>
        <div class="field">
          <label for="reg-password">Password</label>
          <div class="input-wrap has-toggle">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="reg-password" placeholder="Min. 8 characters" autocomplete="new-password" required minlength="8" />
            <button type="button" class="pw-toggle" onclick="togglePw('reg-password',this)" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="btn-register">
          <div class="btn-inner">
            <div class="spinner" id="spinner-register"></div>
            <span id="btn-register-text">Create Account</span>
          </div>
        </button>
      </form>
    </div>

    <!-- Signed-in state -->
    <div class="dashboard-hint" id="logged-in">
      <div class="check-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h3>You're signed in</h3>
      <p id="logged-in-msg">Redirecting to dashboard…</p>
      <button class="btn-secondary" onclick="logout()">Sign Out</button>
    </div>

    <div class="card-footer">FleetStat V2 &mdash; Fleet Management Platform</div>
  </div>
</div>

<script>
  const API_BASE = 'http://127.0.0.1:8000/api/v1';

  const saveToken = t => localStorage.setItem('fleetstat_token', t);
  const getToken  = () => localStorage.getItem('fleetstat_token');
  const clearToken = () => localStorage.removeItem('fleetstat_token');

  function showAlert(msg, type = 'error') {
    const el = document.getElementById('alert');
    el.className = 'alert ' + type + ' show';
    document.getElementById('alert-text').textContent = msg;
  }
  function hideAlert() { document.getElementById('alert').className = 'alert'; }

  function switchTab(tab) {
    hideAlert();
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('panel-' + tab).classList.add('active');
  }

  function togglePw(id, btn) {
    const inp = document.getElementById(id);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.innerHTML = show
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }

  function setLoading(form, on) {
    document.getElementById('btn-' + form).disabled = on;
    document.getElementById('spinner-' + form).style.display = on ? 'block' : 'none';
    document.getElementById('btn-' + form + '-text').textContent =
      form === 'login'
        ? (on ? 'Signing in\u2026' : 'Sign In')
        : (on ? 'Creating account\u2026' : 'Create Account');
  }

  function showLoggedIn(email) {
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('panel-login').style.display = 'none';
    document.getElementById('panel-register').style.display = 'none';
    document.querySelector('.card-title').textContent = 'Access Granted';
    document.querySelector('.card-subtitle').textContent = '';
    const li = document.getElementById('logged-in');
    li.style.display = 'block';
    if (email) document.getElementById('logged-in-msg').textContent = 'Logged in as ' + email;
    hideAlert();
  }

  function logout() { clearToken(); location.reload(); }

  document.getElementById('form-login').addEventListener('submit', async e => {
    e.preventDefault();
    hideAlert();
    const email    = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) { showAlert('Please fill in all fields.'); return; }
    setLoading('login', true);
    try {
      const res  = await fetch(API_BASE + '/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ username: email, password }),
      });
      const data = await res.json();
      if (!res.ok) { showAlert((data.detail || 'Login failed.').trim()); return; }
      saveToken(data.access_token);
      showAlert('Signed in successfully!', 'success');
      setTimeout(() => showLoggedIn(email), 800);
    } catch {
      showAlert('Cannot reach the server. Is the backend running on port 8000?');
    } finally {
      setLoading('login', false);
    }
  });

  document.getElementById('form-register').addEventListener('submit', async e => {
    e.preventDefault();
    hideAlert();
    const username = document.getElementById('reg-username').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    if (!username || !email || !password) { showAlert('Please fill in all fields.'); return; }
    if (password.length < 8) { showAlert('Password must be at least 8 characters.'); return; }
    setLoading('register', true);
    try {
      const res  = await fetch(API_BASE + '/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password }),
      });
      const data = await res.json();
      if (!res.ok) { showAlert((data.detail || 'Registration failed.').trim()); return; }
      showAlert('Account created! You can now sign in.', 'success');
      setTimeout(() => {
        switchTab('login');
        document.getElementById('login-email').value = email;
      }, 1200);
    } catch {
      showAlert('Cannot reach the server. Is the backend running on port 8000?');
    } finally {
      setLoading('register', false);
    }
  });

  // Auto-detect existing session on page load
  (async () => {
    const token = getToken();
    if (!token) return;
    try {
      const res = await fetch(API_BASE + '/auth/me', {
        headers: { Authorization: 'Bearer ' + token },
      });
      if (res.ok) { const u = await res.json(); showLoggedIn(u.email); }
      else clearToken();
    } catch { /* backend offline, show login form */ }
  })();
</script>
</body>
</html>
